<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docdall 편집실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8efe0; --paper: #fffaf1; --ink: #3b2a20; --muted: #7a6657;
    --accent: #b4693a; --accent-soft: #f1dcc4; --line: #e3d2b8; --ok: #5b7f4f; --warn: #a15a2a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Gowun Dodum", "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.7; }
  header { padding: 14px 20px 6px; display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-family: "Gowun Batang", serif; font-size: 20px; }
  .ai-badge { font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 9px; }
  .app { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; padding: 8px 20px 20px; height: calc(100% - 56px); }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; }
  .panel h2 { margin: 0; padding: 12px 16px; font-family: "Gowun Batang", serif; font-size: 16px; border-bottom: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .msg.editor { background: var(--accent-soft); align-self: flex-start; border-top-left-radius: 4px; }
  .msg.author { background: #fff; border: 1px solid var(--line); align-self: flex-end; border-top-right-radius: 4px; }
  .msg.sys { align-self: center; background: #fbe9dd; color: var(--warn); font-size: 14px; max-width: 100%; }
  .msg .who { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--accent); background: #fff; color: var(--accent); padding: 4px 14px; }
  button:hover { background: var(--accent-soft); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #fff; }
  form { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; }
  textarea { font: inherit; width: 100%; min-height: 72px; resize: vertical; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  textarea:focus-visible, button:focus-visible { outline: 3px solid #e0a46f; outline-offset: 2px; }
  .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  #card { padding: 14px 16px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
  .cell { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: #fff; }
  .cell h3 { margin: 0 0 4px; font-family: "Gowun Batang", serif; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
  .chip { font-family: "Gowun Dodum", sans-serif; font-size: 12px; border-radius: 999px; padding: 0 9px; background: #eee; color: var(--muted); white-space: nowrap; }
  .chip.clear { background: #e4efdc; color: var(--ok); }
  .chip.weak { background: #fbe9dd; color: var(--warn); }
  .chip.bookmark { background: var(--accent-soft); color: var(--accent); }
  .cell p { margin: 0; }
  .cell .gap { color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); padding: 0 16px 12px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; height: auto; } #log { max-height: 55vh; } }
</style>
</head>
<body>
<header>
  <h1>Docdall 편집실</h1>
  <span class="ai-badge">AI 편집자 소담</span>
</header>
<div class="app">
  <section class="panel" aria-label="편집자와 대화">
    <h2>편집자와 대화</h2>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="form">
      <textarea id="text" placeholder="여기에 이야기를 적어 주세요" aria-label="작가의 답"></textarea>
      <div class="row">
        <button type="button" id="later">이 질문은 나중에</button>
        <button type="submit" class="primary" id="send">보내기</button>
      </div>
    </form>
  </section>
  <aside class="panel" aria-label="기획서 카드">
    <h2>기획서 카드</h2>
    <div id="card"></div>
    <p class="note">카드에는 작가님이 하신 말만 들어가요.</p>
  </aside>
</div>
<script>
const LABELS = { material: "소재", content: "핵심 내용" };
const CHIP = { clear: ["또렷해요", "clear"], weak: ["다듬는 중", "weak"], empty: ["아직", ""] };
const $ = (id) => document.getElementById(id);
let state = null, busy = false, lastRequest = null;

function addMsg(m) {
  const d = document.createElement("div");
  d.className = "msg " + m.role;
  if (m.role === "editor") { const w = document.createElement("span"); w.className = "who"; w.textContent = "소담 편집자"; d.appendChild(w); }
  d.appendChild(document.createTextNode(m.text));
  if (m.actions && m.actions.length) {
    const box = document.createElement("div"); box.className = "actions";
    m.actions.forEach((a) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = a.label;
      b.onclick = () => { box.querySelectorAll("button").forEach((x) => x.disabled = true); const [act, dim] = a.id.split(":"); send({ action: act, dim, state }, null); };
      box.appendChild(b);
    });
    d.appendChild(box);
  }
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

function renderCard() {
  const card = $("card"); card.textContent = "";
  Object.keys(LABELS).forEach((k) => {
    const d = state ? state.dims[k] : { status: "empty", summary: "", gap: "", bookmark: false };
    const cell = document.createElement("div"); cell.className = "cell";
    const h = document.createElement("h3");
    const name = document.createElement("span"); name.textContent = LABELS[k]; h.appendChild(name);
    const chip = document.createElement("span");
    if (d.bookmark && d.status !== "clear") { chip.className = "chip bookmark"; chip.textContent = "책갈피"; }
    else { const c = CHIP[d.status]; chip.className = "chip " + c[1]; chip.textContent = c[0]; }
    h.appendChild(chip); cell.appendChild(h);
    const p = document.createElement("p");
    if (d.summary) { p.textContent = d.summary; }
    else { p.className = "empty"; p.textContent = d.bookmark ? "나중에 이야기 나눠요." : "아직 비어 있어요."; }
    cell.appendChild(p);
    if (d.gap && d.status !== "clear") { const g = document.createElement("p"); g.className = "gap"; g.textContent = "비어 있는 곳: " + d.gap; cell.appendChild(g); }
    card.appendChild(cell);
  });
}

function setBusy(v) {
  busy = v;
  // 끝난 대화라도 책갈피가 남아 있으면 쓸 수 있다 (스펙 4절 8번)
  const open = !state || state.phase === "interview" || Object.values(state.dims).some((d) => d.bookmark && d.status !== "clear");
  $("send").disabled = v || !open;
  $("later").disabled = v || !state || state.phase !== "interview";
  $("text").disabled = !open;
}

async function send(req, authorText) {
  if (busy) return;
  lastRequest = { req, authorText };
  setBusy(true);
  document.querySelectorAll(".msg.sys").forEach((n) => n.remove());
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 35000);
  try {
    const res = await fetch("/api/turn", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(req), signal: ctrl.signal });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "failed");
    state = data.state;
    if (authorText) { $("text").value = ""; }
    data.messages.forEach(addMsg);
    renderCard();
  } catch (e) {
    const d = addMsg({ role: "sys", text: "응답이 늦어지고 있어요. 쓰신 내용은 그대로 남아 있어요." });
    const box = document.createElement("div"); box.className = "actions";
    const b = document.createElement("button"); b.type = "button"; b.textContent = "다시 시도";
    b.onclick = () => { d.remove(); send(lastRequest.req, lastRequest.authorText); };
    box.appendChild(b); d.appendChild(box);
  } finally {
    clearTimeout(timer);
    setBusy(false);
    $("text").focus();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = $("text").value.trim();
  if (!t || busy || !state) return;
  const m = addMsg({ role: "author", text: t });
  send({ action: "answer", text: t, state }, t).then(() => {});
  // 실패하면 작가가 쓴 말풍선은 남기고 입력창에도 글이 남는다 (다시 시도가 같은 요청을 보낸다)
});
$("later").addEventListener("click", () => { if (!busy && state) send({ action: "park", state }, null); });

(async () => {
  renderCard();
  $("log").setAttribute("aria-busy", "true");
  try {
    const res = await fetch("/api/turn", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "start" }) });
    const data = await res.json();
    state = data.state; data.messages.forEach(addMsg); renderCard();
  } catch { addMsg({ role: "sys", text: "서버에 연결되지 않았어요. 서버가 켜져 있는지 확인해 주세요." }); }
  $("log").removeAttribute("aria-busy");
  setBusy(false);
})();
</script>
</body>
</html>
